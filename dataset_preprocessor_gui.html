<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title> Prune — dataset preprocessor (Python backend)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --md-primary:#6750A4;
    --md-on-primary:#FFFFFF;
    --md-primary-container:#EADDFF;
    --md-on-primary-container:#21005E;
    --md-secondary-container:#D7E3FF;
    --md-on-secondary-container:#041E49;
    --md-tertiary-container:#FFDEA8;
    --md-on-tertiary-container:#402D00;
    --md-error-container:#FFD9E2;
    --md-on-error-container:#3E001D;
    --md-error:#B3261E;
    --md-success:#146C2E;
    --md-surface:#FFFBFE;
    --md-surface-dim:#FAF8FD;
    --md-surface-variant:#F3EDF7;
    --md-on-surface:#1D1B20;
    --md-on-surface-variant:#49454F;
    --md-outline:#CAC4D0;
    --md-outline-strong:#79747E;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:10px;
    --font: 'Roboto', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--md-surface-dim);color:var(--md-on-surface);-webkit-font-smoothing:antialiased;}
  .app{max-width:720px;margin:0 auto;padding-bottom:48px;}
  .topbar{padding:28px 20px 18px;}
  .topbar h1{font-size:28px;font-weight:500;margin:0;color:var(--md-primary);}
  .topbar p{margin:4px 0 0;font-size:14px;color:var(--md-on-surface-variant);}
  .badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:100px;background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);font-size:11px;font-weight:500;}
  .section{padding:0 16px;margin-bottom:16px;}
  .dropzone{border:1.5px dashed var(--md-outline-strong);border-radius:var(--radius-lg);background:var(--md-surface);padding:32px 20px;text-align:center;cursor:pointer;transition:background .15s ease, border-color .15s ease;}
  .dropzone:hover, .dropzone.drag{background:var(--md-primary-container);border-color:var(--md-primary);}
  .dropzone .icon{font-size:34px;margin-bottom:8px;}
  .dropzone h3{margin:0 0 4px;font-size:16px;font-weight:500;color:var(--md-on-surface);}
  .dropzone p{margin:0;font-size:13px;color:var(--md-on-surface-variant);}
  .file-input{display:none;}
  .row-actions{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .btn{border:none;border-radius:100px;padding:10px 20px;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;background:var(--md-secondary-container);color:var(--md-on-secondary-container);}
  .btn.primary{background:var(--md-primary);color:var(--md-on-primary);}
  .btn:active{transform:scale(0.97);}
  .filebar{display:flex;align-items:center;justify-content:space-between;background:var(--md-surface);border-radius:var(--radius-md);padding:12px 16px;font-size:13px;color:var(--md-on-surface-variant);}
  .filebar b{color:var(--md-on-surface);font-weight:500;}
  .filebar button{border:none;background:none;color:var(--md-primary);font-weight:500;font-size:13px;cursor:pointer;font-family:var(--font);}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{border-radius:var(--radius-md);padding:16px;}
  .stat-card .val{font-size:26px;font-weight:500;line-height:1.1;}
  .stat-card .lbl{font-size:12.5px;margin-top:4px;opacity:0.85;}
  .c-violet{background:var(--md-primary-container);color:var(--md-on-primary-container);}
  .c-blue{background:var(--md-secondary-container);color:var(--md-on-secondary-container);}
  .c-amber{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);}
  .c-pink{background:var(--md-error-container);color:var(--md-on-error-container);}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;-ms-overflow-style:none;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:9px 16px;border-radius:100px;font-size:13px;font-weight:500;color:var(--md-on-surface-variant);background:transparent;border:1px solid var(--md-outline);cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary);}
  .panel{background:var(--md-surface);border-radius:var(--radius-lg);padding:18px 16px;min-height:120px;}
  .panel h4{margin:0 0 12px;font-size:14px;font-weight:500;color:var(--md-on-surface);}
  .empty{text-align:center;color:var(--md-on-surface-variant);font-size:13px;padding:24px 8px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--md-surface-variant);}
  th{color:var(--md-on-surface-variant);font-weight:500;}
  td{color:var(--md-on-surface);}
  .pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:500;}
  .pill.numeric{background:var(--md-primary-container);color:var(--md-on-primary-container);}
  .pill.categorical{background:var(--md-secondary-container);color:var(--md-on-secondary-container);}
  .pill.boolean{background:var(--md-tertiary-container);color:var(--md-on-tertiary-container);}
  .pill.datetime{background:var(--md-error-container);color:var(--md-on-error-container);}
  .pill.text{background:var(--md-outline);color:var(--md-surface);}
  select{width:100%;font-family:var(--font);font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--md-outline);background:var(--md-surface);color:var(--md-on-surface);margin-bottom:14px;}
  .mini-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
  .mini-stats div{background:var(--md-surface-variant);border-radius:var(--radius-sm);padding:8px 10px;}
  .mini-stats .v{font-size:14px;font-weight:500;}
  .mini-stats .l{font-size:10.5px;color:var(--md-on-surface-variant);margin-top:1px;}
  .chart-img{width:100%;height:auto;border-radius:var(--radius-sm);background:var(--md-surface);display:block;}
  .target-bar{display:flex;align-items:center;gap:10px;background:var(--md-surface);border-radius:var(--radius-md);padding:10px 14px;}
  .target-bar label{font-size:12.5px;color:var(--md-on-surface-variant);flex-shrink:0;}
  .target-bar select{margin:0;flex:1;}
  .toggle-group{display:flex;gap:6px;margin-bottom:12px;}
  .toggle-group button{flex:1;border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface-variant);font-family:var(--font);font-size:12.5px;font-weight:500;padding:8px;border-radius:100px;cursor:pointer;}
  .toggle-group button.active{background:var(--md-primary-container);color:var(--md-on-primary-container);border-color:transparent;}
  .action-btn{display:block;width:100%;border:none;border-radius:100px;padding:11px;font-family:var(--font);font-size:13px;font-weight:500;background:var(--md-primary-container);color:var(--md-on-primary-container);cursor:pointer;margin-top:8px;}
  .action-btn.filled{background:var(--md-primary);color:var(--md-on-primary);}
  .action-btn:active{transform:scale(0.98);}
  .field-label{font-size:12px;color:var(--md-on-surface-variant);margin:14px 0 6px;}
  .field-label:first-child{margin-top:0;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{padding:6px 12px;border-radius:100px;font-size:12px;font-weight:500;border:1px solid var(--md-outline);background:transparent;color:var(--md-on-surface-variant);cursor:pointer;}
  .note{font-size:12px;color:var(--md-on-surface-variant);margin-top:8px;line-height:1.5;}
  .divider{height:1px;background:var(--md-surface-variant);margin:16px 0;}
  input[type="range"]{width:100%;margin:4px 0 2px;}
  .loading{text-align:center;padding:30px 8px;color:var(--md-on-surface-variant);font-size:13px;}
  .error-box{background:var(--md-error-container);color:var(--md-on-error-container);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;}

  /* ---------- Desktop mode ---------- */
  body.desktop-mode .app{max-width:1870px;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-areas:"header header" "upload upload" "filebar filebar" "stats stats" "target target" "tabs panel";column-gap:28px;padding:0 32px 56px;}
  body.desktop-mode .topbar{grid-area:header;padding:36px 0 20px;}
  body.desktop-mode .topbar h1{font-size:36px;}
  body.desktop-mode .topbar p{font-size:15px;}
  body.desktop-mode #uploadSection{grid-area:upload;padding:0;}
  body.desktop-mode #fileBarSection{grid-area:filebar;padding:0;}
  body.desktop-mode #statsSection{grid-area:stats;padding:0;}
  body.desktop-mode #targetSection{grid-area:target;padding:0;}
  body.desktop-mode #tabsSection{grid-area:tabs;padding:0;align-self:start;position:sticky;top:24px;}
  body.desktop-mode #panelSection{grid-area:panel;padding:0;min-width:0;}
  body.desktop-mode .dropzone{padding:56px 32px;}
  body.desktop-mode .stats-grid{grid-template-columns:repeat(4,1fr);gap:14px;}
  body.desktop-mode .stat-card{padding:20px;}
  body.desktop-mode .stat-card .val{font-size:30px;}
  body.desktop-mode .tabs{flex-direction:column;overflow-x:visible;gap:4px;padding:0;}
  body.desktop-mode .tab{text-align:left;width:100%;padding:11px 16px;}
  body.desktop-mode .panel{padding:28px 30px;box-shadow:0 1px 3px rgba(29,27,32,0.08);}
  body.desktop-mode .panel h4{font-size:16px;}
  body.desktop-mode table{font-size:13.5px;}
  body.desktop-mode .mini-stats{grid-template-columns:repeat(6,1fr);}
  body.desktop-mode select{max-width:420px;}
  body.desktop-mode .action-btn{max-width:420px;}
  body.desktop-mode .toggle-group{max-width:420px;}
  body.desktop-mode .chart-img{max-width:640px;}
  body.desktop-mode .field-label{margin-top:18px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <h1>Prune</h1>
    <p>Upload any tabular dataset to inspect its shape, gaps and structure.</p>
    <span class="badge">Python backend · pandas / scikit-learn</span>
  </div>

  <div class="section" id="uploadSection">
    <div class="dropzone" id="dropzone">
      <div class="icon">📄</div>
      <h3>Drop a CSV, Excel or JSON file here</h3>
      <p>or tap to browse from your device</p>
      <input type="file" id="fileInput" class="file-input" accept=".csv,text/csv,.xlsx,.xls,.json,application/json" />
    </div>
    <div class="row-actions">
      <button class="btn" id="sampleBtn">Try sample data</button>
    </div>
    <div id="uploadError"></div>
  </div>

  <div class="section" id="fileBarSection" style="display:none;">
    <div class="filebar">
      <span><b id="fileNameLabel"></b></span>
      <button id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="section" id="statsSection" style="display:none;">
    <div class="stats-grid">
      <div class="stat-card c-violet"><div class="val" id="statRows">0</div><div class="lbl">Rows</div></div>
      <div class="stat-card c-blue"><div class="val" id="statCols">0</div><div class="lbl">Columns</div></div>
      <div class="stat-card c-amber"><div class="val" id="statMissing">0%</div><div class="lbl">Missing cells</div></div>
      <div class="stat-card c-pink"><div class="val" id="statDupes">0</div><div class="lbl">Duplicate rows</div></div>
    </div>
  </div>

  <div class="section" id="targetSection" style="display:none;">
    <div class="target-bar">
      <label>Target</label>
      <select id="targetSelect"></select>
    </div>
  </div>

  <div class="section" id="tabsSection" style="display:none;">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="preview">Preview</button>
      <button class="tab" data-tab="profile">Profile</button>
      <button class="tab" data-tab="warnings">Warnings</button>
      <button class="tab" data-tab="quality">Quality</button>
      <button class="tab" data-tab="missing">Missing</button>
      <button class="tab" data-tab="distributions">Distributions</button>
      <button class="tab" data-tab="outliers">Outliers</button>
      <button class="tab" data-tab="target">Target</button>
      <button class="tab" data-tab="relationships">Relationships</button>
      <button class="tab" data-tab="correlation">Correlation</button>
      <button class="tab" data-tab="prepare">Prepare</button>
      <button class="tab" data-tab="model">Model</button>
      <button class="tab" data-tab="compare">Compare</button>
    </div>
  </div>

  <div class="section" id="panelSection" style="display:none;">
    <div class="panel" id="panelOverview"></div>
    <div class="panel" id="panelPreview" style="display:none;"></div>
    <div class="panel" id="panelProfile" style="display:none;"></div>
    <div class="panel" id="panelWarnings" style="display:none;"></div>
    <div class="panel" id="panelQuality" style="display:none;"></div>
    <div class="panel" id="panelMissing" style="display:none;"></div>
    <div class="panel" id="panelDistributions" style="display:none;"></div>
    <div class="panel" id="panelOutliers" style="display:none;"></div>
    <div class="panel" id="panelTarget" style="display:none;"></div>
    <div class="panel" id="panelRelationships" style="display:none;"></div>
    <div class="panel" id="panelCorrelation" style="display:none;"></div>
    <div class="panel" id="panelPrepare" style="display:none;"></div>
    <div class="panel" id="panelModel" style="display:none;"></div>
    <div class="panel" id="panelCompare" style="display:none;"></div>
  </div>
</div>

<script>
const el = id => document.getElementById(id);
let appState = { filename:null, columns:[], types:{}, targetCol:null, rows:0 };

function updateDeviceMode(){
  const isDesktop = window.matchMedia("(min-width: 900px) and (pointer: fine)").matches;
  document.body.classList.toggle("desktop-mode", isDesktop);
}
updateDeviceMode();
window.addEventListener("resize", updateDeviceMode);

// ---------------------------------------------------------------------
// API helper — every call goes to the Flask backend (backend.py)
// ---------------------------------------------------------------------
async function api(path, options={}){
  const res = await fetch(path, options);
  let data;
  try{ data = await res.json(); }
  catch(e){ throw new Error("Bad response from server"); }
  if(!res.ok){ throw new Error(data.error || "Request failed"); }
  return data;
}

function fmtPct(n){ return (Math.round(n*10)/10) + "%"; }

// ---------------------------------------------------------------------
// Upload
// ---------------------------------------------------------------------
const dropzone = el("dropzone");
const fileInput = el("fileInput");
dropzone.addEventListener("click", ()=>fileInput.click());
dropzone.addEventListener("dragover", e=>{ e.preventDefault(); dropzone.classList.add("drag"); });
dropzone.addEventListener("dragleave", ()=>dropzone.classList.remove("drag"));
dropzone.addEventListener("drop", e=>{
  e.preventDefault(); dropzone.classList.remove("drag");
  if(e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", ()=>{ if(fileInput.files.length) uploadFile(fileInput.files[0]); });

el("sampleBtn").addEventListener("click", async ()=>{
  el("uploadError").innerHTML = "";
  try{
    const data = await api("/api/sample", {method:"POST"});
    onDatasetLoaded(data);
  }catch(e){ showUploadError(e.message); }
});

async function uploadFile(file){
  el("uploadError").innerHTML = "";
  const fd = new FormData();
  fd.append("file", file);
  try{
    const data = await api("/api/load", {method:"POST", body:fd});
    onDatasetLoaded(data);
  }catch(e){ showUploadError(e.message); }
}

function showUploadError(msg){
  el("uploadError").innerHTML = `<div class="error-box" style="margin-top:12px;">${msg}</div>`;
}

function onDatasetLoaded(data){
  appState = { filename:data.filename, columns:data.columns, types:data.types, targetCol:data.target_col, rows:data.rows };
  el("fileNameLabel").textContent = data.filename + " · " + data.rows + " rows";
  el("uploadSection").style.display = "none";
  el("fileBarSection").style.display = "block";
  el("statsSection").style.display = "block";
  el("targetSection").style.display = "block";
  el("tabsSection").style.display = "block";
  el("panelSection").style.display = "block";

  const targetSelect = el("targetSelect");
  targetSelect.innerHTML = data.columns.map(c=>`<option value="${c}">${c}</option>`).join("");
  targetSelect.value = data.target_col;
  targetSelect.onchange = async ()=>{
    appState.targetCol = targetSelect.value;
    await api("/api/prepare/set_target", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({target_col: targetSelect.value})});
    renderStatsFromOverview(data.overview);
    if(currentTab==="target") renderTarget();
    if(currentTab==="relationships") renderRelationships();
    if(currentTab==="correlation") renderCorrelation();
    if(currentTab==="model") renderModel();
  };

  renderStatsFromOverview(data.overview);
  switchTab("overview");
}

function renderStatsFromOverview(overview){
  el("statRows").textContent = overview.n_rows.toLocaleString();
  el("statCols").textContent = overview.n_cols;
  const totalCells = overview.n_rows * overview.n_cols;
  const totalMissing = overview.summary.reduce((a,o)=>a+o.missing,0);
  el("statMissing").textContent = totalCells ? fmtPct(totalMissing/totalCells*100) : "0%";
  el("statDupes").textContent = overview.n_dupes.toLocaleString();
}

el("clearBtn").addEventListener("click", ()=>{
  el("uploadSection").style.display = "block";
  el("fileBarSection").style.display = "none";
  el("statsSection").style.display = "none";
  el("targetSection").style.display = "none";
  el("tabsSection").style.display = "none";
  el("panelSection").style.display = "none";
  fileInput.value = "";
});

// ---------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------
let currentTab = "overview";
const panelRenderers = {
  overview: renderOverview,
  preview: renderPreview,
  profile: renderProfile,
  warnings: renderWarnings,
  quality: renderQuality,
  missing: renderMissing,
  distributions: renderDistributions,
  outliers: renderOutliers,
  target: renderTarget,
  relationships: renderRelationships,
  correlation: renderCorrelation,
  prepare: renderPrepare,
  model: renderModel,
  compare: renderCompare,
};

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>switchTab(btn.dataset.tab));
});

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  ["Overview","Preview","Profile","Warnings","Quality","Missing","Distributions","Outliers","Target","Relationships","Correlation","Prepare","Model","Compare"].forEach(name=>{
    el("panel"+name).style.display = (name.toLowerCase()===tab) ? "block" : "none";
  });
  panelRenderers[tab]();
}

function loadingHtml(msg){ return `<div class="loading">${msg || "Loading…"}</div>`; }
function errorHtml(msg){ return `<div class="error-box">${msg}</div>`; }

// ---------------------------------------------------------------------
// Overview
// ---------------------------------------------------------------------
async function renderOverview(){
  el("panelOverview").innerHTML = loadingHtml();
  try{
    const ov = await api("/api/overview");
    const rows = ov.summary.map(o=>`
      <tr>
        <td>${o.column}</td>
        <td><span class="pill ${appState.types[o.column]||'categorical'}">${appState.types[o.column]||o.dtype}</span></td>
        <td>${o.unique}</td>
        <td>${o.missing_pct}%</td>
      </tr>`).join("");
    el("panelOverview").innerHTML = `
      <h4>Column summary</h4>
      <div class="note">${ov.n_rows} rows · ${ov.n_cols} columns · ${ov.n_dupes} duplicate rows · ${ov.n_numeric} numeric, ${ov.n_categorical} categorical, ${ov.n_datetime} datetime columns</div>
      <table style="margin-top:12px;"><tr><th>Column</th><th>Type</th><th>Unique</th><th>Missing</th></tr>${rows}</table>`;
  }catch(e){ el("panelOverview").innerHTML = errorHtml(e.message); }
}

// ---------------------------------------------------------------------
// Data preview
// ---------------------------------------------------------------------
async function renderPreview(){
  el("panelPreview").innerHTML = `
    <h4>Data preview</h4>
    <div class="toggle-group" id="previewModeToggle">
      <button data-mode="head" class="active">Head</button>
      <button data-mode="tail">Tail</button>
      <button data-mode="sample">Random sample</button>
    </div>
    <div id="previewBody">${loadingHtml()}</div>`;
  const toggle = el("previewModeToggle");
  toggle.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{
      toggle.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      updatePreviewBody(b.dataset.mode);
    });
  });
  updatePreviewBody("head");
}

async function updatePreviewBody(mode){
  el("previewBody").innerHTML = loadingHtml();
  try{
    const p = await api(`/api/preview?n=10&mode=${mode}`);
    const head = `<tr>${p.columns.map(c=>`<th>${c}</th>`).join("")}</tr>`;
    const rows = p.rows.map(r=>`<tr>${p.columns.map(c=>`<td>${r[c]===null||r[c]===undefined?"—":r[c]}</td>`).join("")}</tr>`).join("");
    el("previewBody").innerHTML = `
      <div class="note">Showing ${p.rows.length} of ${p.n_rows_total} rows · ${p.n_cols_total} columns.</div>
      <div style="overflow-x:auto;"><table style="margin-top:10px;">${head}${rows}</table></div>`;
  }catch(e){ el("previewBody").innerHTML = errorHtml(e.message); }
}

// ---------------------------------------------------------------------
// Automatic dataset profiling
// ---------------------------------------------------------------------
async function renderProfile(){
  el("panelProfile").innerHTML = loadingHtml();
  try{
    const p = await api("/api/profile");
    const rows = p.columns.map(c=>{
      const extra = c.type==="numeric"
        ? `mean ${c.mean ?? "—"} · std ${c.std ?? "—"} · min ${c.min ?? "—"} · max ${c.max ?? "—"} · skew ${c.skewness ?? "—"}`
        : (c.top_value!==undefined ? `top: "${c.top_value}" (${c.top_pct}%)` : "");
      return `<tr>
        <td>${c.column}${c.is_constant?' <span class="pill" style="background:var(--md-error-container);color:var(--md-on-error-container);">constant</span>':''}</td>
        <td><span class="pill ${c.type}">${c.type}</span></td>
        <td>${c.unique} (${c.unique_pct}%)</td>
        <td>${c.missing_pct}%</td>
        <td style="font-size:11.5px;color:var(--md-on-surface-variant);">${extra}</td>
      </tr>`;
    }).join("");
    el("panelProfile").innerHTML = `
      <h4>Automatic dataset profile</h4>
      <div class="mini-stats" style="grid-template-columns:repeat(3,1fr);">

function renderOutliers(){

  el("panelOutliers").innerHTML = `

      <button data-method="zscore">Z-score</button>

async function updateOutlierSummary(){
  try{

    if(!s.summary.length){ el("outlierSummaryBody").innerHTML = `<div class="empty">No numeric columns.</div>`; return; }
    el("outlierSummaryBody").innerHTML = `<div style="overflow-x:auto;"><table>
      <tr><th>Column</th><th>IQR outliers</th><th>MAD outliers</th></tr>
      ${s.summary.map(r=>`<tr><td>${r.column}</td><td>${r.iqr_outliers} (${r.iqr_pct}%)</td><td>${r.mad_outliers} (${r.mad_pct}%)</td></tr>`).join("")}
      </table></div>`;

async function updateOutlierBody(method){
  const col = el("outlierColSelect").value;
  el("outlierBody").innerHTML = loadingHtml();
  try{
    if(method==="mad"){
      const res = await api(`/api/outliers/mad?col=${encodeURIComponent(col)}`);
      el("outlierBody").innerHTML = `
        <div class="mini-stats" style="grid-template-columns:1fr 1fr;">
          <div><div class="v">${res.n_outliers}</div><div class="l">flagged (modified z &gt; 3.5)</div></div>
          <div><div class="v">${res.outlier_pct}%</div><div class="l">of column</div></div>
        </div>
        <div class="note">Modified Z-score uses the median and MAD instead of mean/std, so it's more robust to skewed data than a plain Z-score.</div>`;
      return;
    }
    const res = await api(`/api/outliers?col=${encodeURIComponent(col)}&method=${method}`);
    if(method==="zscore"){
      el("outlierBody").innerHTML = `
        <div class="mini-stats" style="grid-template-columns:1fr 1fr;">
          <div><div class="v">${res.n_outliers}</div><div class="l">flagged (|z| &gt; 3)</div></div>
          <div><div class="v">${res.outlier_pct}%</div><div class="l">of column</div></div>
        </div>`;
      return;
    }
    el("outlierBody").innerHTML = `
      <img class="chart-img" src="${res.chart}" alt="Boxplot of ${col}" />
      <div class="mini-stats">
        <div><div class="v">${res.lower_bound.toFixed(2)}</div><div class="l">lower bound</div></div>
        <div><div class="v">${res.upper_bound.toFixed(2)}</div><div class="l">upper bound</div></div>
        <div><div class="v">${res.n_outliers} (${res.outlier_pct}%)</div><div class="l">flagged</div></div>
      </div>`;
  }catch(e){ el("outlierBody").innerHTML = errorHtml(e.message); }
}

// ---------------------------------------------------------------------
// Correlation / redundancy / leakage
// ---------------------------------------------------------------------
let corrMethod = "pearson";
async function renderCorrelation(){
  el("panelCorrelation").innerHTML = loadingHtml();
  try{
    const [c, tr] = await Promise.all([
      api(`/api/correlation?method=${corrMethod}`),
      api(`/api/correlation/target?method=${corrMethod}&target=${encodeURIComponent(appState.targetCol)}`)
    ]);
    if(!c.chart){
      el("panelCorrelation").innerHTML = `<h4>Correlation</h4><div class="empty">Need at least two numeric columns.</div>`;
      return;
    }
    const targetRankHtml = tr.ranking.length
      ? `<table><tr><th>Column</th><th>Correlation with "${tr.target}"</th></tr>${tr.ranking.map(r=>`<tr><td>${r.column}</td><td>${r.correlation===null?"n/a":r.correlation}</td></tr>`).join("")}</table>`
      : `<div class="empty">Target must be numeric to rank correlations against it.</div>`;
    const strongHtml = c.strong_pairs.length
      ? `<table style="margin-top:14px;"><tr><th>Pair</th><th>Correlation</th></tr>${c.strong_pairs.map(p=>`<tr><td>${p.feature_1} · ${p.feature_2}</td><td>${p.correlation.toFixed(2)}</td></tr>`).join("")}</table>`
      : `<div class="empty">No strongly correlated pairs (|r| ≥ 0.7).</div>`;
    const redundantHtml = c.redundant_pairs.length
      ? `<table><tr><th>Pair</th><th>Correlation</th></tr>${c.redundant_pairs.map(p=>`<tr><td>${p.feature_1} · ${p.feature_2}</td><td>${p.correlation.toFixed(3)}</td></tr>`).join("")}</table>
         <div class="note">These pairs carry almost the same information — consider dropping one.</div>`
      : `<div class="empty">No redundant pairs found (|r| ≥ 0.95).</div>`;
    const leakageHtml = c.leakage_flags.length
      ? `<table><tr><th>Column</th><th>Reason</th></tr>${c.leakage_flags.map(f=>`<tr><td>${f.column}</td><td>${f.reason}</td></tr>`).join("")}</table>
         <div class="note">Review these columns — they may leak information about the target.</div>`
      : `<div class="empty">No obvious leakage signals against "${appState.targetCol}".</div>`;

    el("panelCorrelation").innerHTML = `
      <h4>Correlation matrix</h4>
      <div class="toggle-group" id="corrMethodToggle">
        <button data-method="pearson" class="${corrMethod==='pearson'?'active':''}">Pearson</button>
        <button data-method="spearman" class="${corrMethod==='spearman'?'active':''}">Spearman</button>
        <button data-method="kendall" class="${corrMethod==='kendall'?'active':''}">Kendall</button>
      </div>
      <img class="chart-img" src="${c.chart}" alt="Correlation matrix" />
      ${strongHtml}
      <div class="divider"></div>
      <h4>Ranked correlation with target</h4>${targetRankHtml}
      <div class="divider"></div>
      <h4>Redundant features</h4>${redundantHtml}
      <div class="divider"></div>
      <h4>Possible data leakage</h4>${leakageHtml}`;
    const ctoggle = el("corrMethodToggle");
    ctoggle.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click", ()=>{ corrMethod = b.dataset.method; renderCorrelation(); });
    });
  }catch(e){ el("panelCorrelation").innerHTML = errorHtml(e.message); }
}

async function renderCompare(){

      <tr>
        <td>${r.column}</td>

    el("panelCompare").innerHTML = `
      <h4>Before / after — original upload vs working copy</h4>
      <div class="mini-stats" style="grid-template-columns:1fr 1fr;">
        <div><div class="v">${c.rows_before} → ${c.rows_after}</div><div class="l">rows</div></div>
        <div><div class="v">${c.cols_before} → ${c.cols_after}</div><div class="l">columns</div></div>

}

function wirePrepareHandlers(p){

      catch(e){ alert(e.message); }
    });
  });
  document.querySelectorAll('[data-action="extract-text"]').forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{ await api("/api/prepare/extract_text", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({column: btn.dataset.col})}); renderPrepare(); }
      catch(e){ alert(e.message); }
    });

  document.querySelectorAll('[data-action="bool-to-int"]').forEach(btn=>{

// ---------------------------------------------------------------------
// Model — baseline machine learning, comparison & evaluation
// ---------------------------------------------------------------------
const METRIC_LABELS = {
  accuracy:"Accuracy", precision:"Precision", recall:"Recall", f1:"F1", roc_auc:"ROC-AUC", pr_auc:"PR-AUC",
  mae:"MAE", mse:"MSE", rmse:"RMSE", r2:"R²", mape:"MAPE",
};
const TASK_METRIC_ORDER = {
  classification: ["accuracy","precision","recall","f1","roc_auc","pr_auc"],
  regression: ["mae","rmse","r2","mape","mse"],
};

async function renderModel(){
  el("panelModel").innerHTML = loadingHtml();
  try{
    const t = await api("/api/model/task");
    if(!t.has_split){
      el("panelModel").innerHTML = `
        <h4>Baseline machine learning</h4>
        <div class="empty">Split your dataset into train / validation / test first (in the <b>Prepare</b> tab), then come back here to train and compare models.</div>`;
      return;
    }
    const list = await api(`/api/model/list?task=${t.task}`);
    renderModelPicker(t, list);
  }catch(e){ el("panelModel").innerHTML = errorHtml(e.message); }
}

function renderModelPicker(t, list){
  const missingDeps = ["xgboost","lightgbm"].filter(dep=>!list.optional_deps[dep]);
  const checks = list.models.map(m=>`
    <label style="display:flex;align-items:center;gap:8px;padding:7px 2px;font-size:13px;">
      <input type="checkbox" class="model-check" value="${m.id}" ${list.trained.includes(m.id)?"checked":""}/>
      ${m.label}
    </label>`).join("");

  el("panelModel").innerHTML = `
    <h4>Baseline machine learning</h4>
    <div class="note">Target: <b>${t.target_col}</b> · Task detected: <b>${t.task}</b>. Models train on the train split and are scored on the held-out split from Prepare.</div>
    <div class="divider"></div>
    <div class="field-label">Choose models to train</div>
    <div id="modelCheckList">${checks}</div>
    ${missingDeps.length ? `<div class="note">Optional: <code>pip install ${missingDeps.join(" ")}</code> to unlock ${missingDeps.join(" / ")} here too.</div>` : ""}
    <button class="action-btn filled" id="trainModelsBtn">Train &amp; compare selected models</button>
    <div id="modelTrainStatus"></div>
    <div class="divider"></div>
    <div id="modelComparisonArea"></div>
    <div id="modelDetailArea"></div>
    <div class="divider"></div>
    <div id="experimentLogArea"></div>
  `;

  document.getElementById("trainModelsBtn").addEventListener("click", async ()=>{
    const ids = Array.from(document.querySelectorAll(".model-check:checked")).map(c=>c.value);
    if(!ids.length){ alert("Choose at least one model."); return; }
    const statusEl = document.getElementById("modelTrainStatus");
    statusEl.innerHTML = loadingHtml(`Training ${ids.length} model(s)…`);
    document.getElementById("modelDetailArea").innerHTML = "";
    try{
      const r = await api("/api/model/train", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({model_ids: ids})});
      statusEl.innerHTML = Object.keys(r.errors||{}).length
        ? `<div class="error-box">Some models failed to train: ${Object.entries(r.errors).map(([k,v])=>`${k} — ${v}`).join("; ")}</div>`
        : "";
      renderComparisonTable(r);
      renderExperimentLog();
    }catch(e){ statusEl.innerHTML = errorHtml(e.message); }
  });

  if(list.trained.length){
    api("/api/model/compare").then(r=>{ if(r.comparison && r.comparison.length) renderComparisonTable(r); }).catch(()=>{});
  }
  renderExperimentLog();
}

function fmtMetric(task, key, v){
  if(v===null || v===undefined) return "—";
  if(key==="mape") return v.toFixed(1)+"%";
  if(task==="regression") return (Math.abs(v) >= 100 ? v.toFixed(1) : v.toFixed(3));
  return v.toFixed(3);
}

function renderComparisonTable(r){
  const area = document.getElementById("modelComparisonArea");
  if(!area) return;
  if(!r.comparison || !r.comparison.length){
    area.innerHTML = `<div class="empty">No trained models yet.</div>`;
    return;
  }
  const task = r.task;
  const metricKeys = TASK_METRIC_ORDER[task].filter(k=>r.comparison.some(row=>row[k]!==undefined));
  const primary = task==="classification" ? "f1" : "rmse";
  const higherIsBetter = task==="classification";
  const sorted = [...r.comparison].sort((a,b)=>{
    const av=a[primary], bv=b[primary];
    if(av===null||av===undefined) return 1;
    if(bv===null||bv===undefined) return -1;
    return higherIsBetter ? (bv-av) : (av-bv);
  });

  const header = `<th>Model</th>` + metricKeys.map(k=>
    `<th title="${(r.metric_info[k]||"").replace(/"/g,'&quot;')}">${METRIC_LABELS[k]||k} ⓘ</th>`).join("") + `<th></th>`;
  const rows = sorted.map(row=>`
    <tr>
      <td>${row.label}</td>
      ${metricKeys.map(k=>`<td>${fmtMetric(task,k,row[k])}</td>`).join("")}
      <td><button class="chip" data-detail="${row.model_id}">Details</button></td>
    </tr>`).join("");
  const legend = metricKeys.map(k=>`<div class="note"><b>${METRIC_LABELS[k]||k}:</b> ${r.metric_info[k]||""}</div>`).join("");

  area.innerHTML = `
    <div class="field-label">Model comparison ${r.eval_split ? `(scored on the <b>${r.eval_split}</b> split)` : ""}</div>
    <div style="overflow-x:auto;"><table>${header}${rows}</table></div>
    <div class="note" style="margin-top:10px;">ⓘ hover a column header for its definition — or read on:</div>
    ${legend}
  `;
  area.querySelectorAll("[data-detail]").forEach(btn=>{
    btn.addEventListener("click", ()=>renderModelDetail(btn.dataset.detail));
  });
}

async function renderModelDetail(modelId){
  const area = document.getElementById("modelDetailArea");
  if(!area) return;
  area.innerHTML = loadingHtml();
  try{
    const d = await api(`/api/model/result/${modelId}`);
    let body = "";
    if(d.task === "classification"){
      body = `
        <div class="field-label">Confusion matrix</div>
        <img class="chart-img" style="max-width:340px;" src="${d.confusion_matrix_chart}" />
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
          ${d.roc_chart ? `<img class="chart-img" style="max-width:280px;flex:1 1 240px;" src="${d.roc_chart}" />` : ""}
          ${d.pr_chart ? `<img class="chart-img" style="max-width:280px;flex:1 1 240px;" src="${d.pr_chart}" />` : ""}
        </div>
        ${(!d.roc_chart && !d.pr_chart) ? `<div class="note">ROC/PR curves need class probabilities; not available for this model on a multi-class target.</div>` : ""}
        <div class="field-label">Classification report</div>
        ${renderClassificationReportTable(d.classification_report)}
      `;
    } else {
      body = `
        <div class="field-label">Actual vs. predicted &amp; residuals</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <img class="chart-img" style="max-width:320px;flex:1 1 260px;" src="${d.actual_vs_predicted_chart}" />
          <img class="chart-img" style="max-width:320px;flex:1 1 260px;" src="${d.residual_chart}" />
        </div>
        <div class="field-label">Prediction error distribution</div>
        <img class="chart-img" style="max-width:420px;" src="${d.error_distribution_chart}" />
      `;
    }
    area.innerHTML = `
      <div class="divider"></div>
      <h4>${d.label} — detailed evaluation</h4>
      ${body}
      <button class="action-btn" id="downloadModelBtn" style="margin-top:14px;">Download this model (.joblib)</button>
      <div class="divider"></div>
      <div class="field-label">Feature importance</div>
      <div id="featImpArea-${modelId}"><button class="action-btn" id="featImpBtn-${modelId}">Compute feature importance</button></div>
      <div class="divider"></div>
      <div class="field-label">Predict on new input</div>
      <div id="predictArea-${modelId}"><button class="action-btn" id="predictFormBtn-${modelId}">Build prediction form</button></div>
    `;
    document.getElementById("downloadModelBtn").addEventListener("click", ()=>{
      window.location.href = `/api/model/download/${modelId}`;
    });
    document.getElementById(`featImpBtn-${modelId}`).addEventListener("click", ()=>renderFeatureImportance(modelId));
    document.getElementById(`predictFormBtn-${modelId}`).addEventListener("click", ()=>renderPredictForm(modelId));
    area.scrollIntoView({behavior:"smooth", block:"nearest"});
  }catch(e){ area.innerHTML = errorHtml(e.message); }
}

async function renderFeatureImportance(modelId){
  const fiArea = document.getElementById(`featImpArea-${modelId}`);
  fiArea.innerHTML = loadingHtml();
  try{
    const fi = await api(`/api/model/feature_importance/${modelId}`);
    fiArea.innerHTML = `
      <div class="note">${fi.method}</div>
      <img class="chart-img" style="max-width:520px;" src="${fi.chart}" />
    `;
  }catch(e){ fiArea.innerHTML = errorHtml(e.message); }
}

async function renderPredictForm(modelId){
  const pArea = document.getElementById(`predictArea-${modelId}`);
  pArea.innerHTML = loadingHtml();
  try{
    const pf = await api(`/api/model/predict_form/${modelId}`);
    if(!pf.features.length){
      pArea.innerHTML = `<div class="empty">No input features available.</div>`;
      return;
    }
    const fields = pf.features.map(f=>{
      if(f.type === "numeric"){
        const hint = f.mean!==null && f.mean!==undefined ? ` (e.g. ${f.mean.toFixed(3)})` : "";
        return `<label style="display:block;margin:6px 0;font-size:13px;">${f.name}${hint}
          <input type="number" step="any" class="predict-input" data-feature="${f.name}" style="width:100%;padding:6px;margin-top:3px;"/></label>`;
      }
      const opts = f.options.map(o=>`<option value="${o}">${o}</option>`).join("");
      return `<label style="display:block;margin:6px 0;font-size:13px;">${f.name}
        <select class="predict-input" data-feature="${f.name}" style="width:100%;padding:6px;margin-top:3px;">
          <option value="">—</option>${opts}
        </select></label>`;
    }).join("");
    pArea.innerHTML = `
      <div style="max-width:420px;">${fields}</div>
      <button class="action-btn filled" id="predictRunBtn-${modelId}" style="margin-top:8px;">Predict</button>
      <div id="predictResult-${modelId}" style="margin-top:10px;"></div>
    `;
    document.getElementById(`predictRunBtn-${modelId}`).addEventListener("click", async ()=>{
      const resEl = document.getElementById(`predictResult-${modelId}`);
      const values = {};
      pArea.querySelectorAll(".predict-input").forEach(inp=>{ values[inp.dataset.feature] = inp.value; });
      resEl.innerHTML = loadingHtml();
      try{
        const pr = await api(`/api/model/predict/${modelId}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({values})});
        let html = `<div class="note"><b>Prediction:</b> ${pr.prediction}</div>`;
        if(pr.probabilities){
          const rows = Object.entries(pr.probabilities).sort((a,b)=>b[1]-a[1])
            .map(([c,p])=>`<tr><td>${c}</td><td>${(p*100).toFixed(1)}%</td></tr>`).join("");
          html += `<div style="overflow-x:auto;"><table><tr><th>Class</th><th>Probability</th></tr>${rows}</table></div>`;
        }
        resEl.innerHTML = html;
      }catch(e){ resEl.innerHTML = errorHtml(e.message); }
    });
  }catch(e){ pArea.innerHTML = errorHtml(e.message); }
}

// ---------------------------------------------------------------------
// Experiment tracking — a persistent log of every model trained this
// session (across models / splits), independent of the comparison table.
// ---------------------------------------------------------------------
async function renderExperimentLog(){
  const area = document.getElementById("experimentLogArea");
  if(!area) return;
  try{
    const r = await api("/api/experiments");
    const exps = r.experiments || [];
    if(!exps.length){
      area.innerHTML = `<div class="field-label">Experiment log</div><div class="empty">No experiments run yet — training a model above logs a run here.</div>`;
      return;
    }
    const metricKeys = Object.keys(METRIC_LABELS).filter(k=>exps.some(e=>e.metrics[k]!==undefined && e.metrics[k]!==null));
    const header = `<th>Time</th><th>Model</th><th>Task</th><th>Split</th>` + metricKeys.map(k=>`<th>${METRIC_LABELS[k]||k}</th>`).join("");
    const rows = [...exps].reverse().map(e=>`
      <tr>
        <td>${e.timestamp}</td>
        <td>${e.label}</td>
        <td>${e.task}</td>
        <td>${e.eval_split||""}</td>
        ${metricKeys.map(k=>`<td>${fmtMetric(e.task,k,e.metrics[k])}</td>`).join("")}
      </tr>`).join("");
    area.innerHTML = `
      <div class="field-label">Experiment log (${exps.length} run${exps.length===1?"":"s"})</div>
      <div style="overflow-x:auto;"><table>${header}${rows}</table></div>
      <div style="margin-top:8px;display:flex;gap:8px;">
        <button class="action-btn" id="expDownloadBtn">Download log (.csv)</button>
        <button class="action-btn" id="expClearBtn">Clear log</button>
      </div>
    `;
    document.getElementById("expDownloadBtn").addEventListener("click", ()=>{
      window.location.href = "/api/experiments/download";
    });
    document.getElementById("expClearBtn").addEventListener("click", async ()=>{
      if(!confirm("Clear the experiment log? This can't be undone.")) return;
      await api("/api/experiments/clear", {method:"POST"});
      renderExperimentLog();
    });
  }catch(e){ area.innerHTML = errorHtml(e.message); }
}

function renderClassificationReportTable(report){
  const classLabels = Object.keys(report).filter(k=>!["accuracy","macro avg","weighted avg"].includes(k));
  const rowKeys = [...classLabels, "macro avg", "weighted avg"].filter(k=>report[k]);
  const rows = rowKeys.map(k=>{
    const rr = report[k];
    return `<tr><td>${k}</td><td>${rr.precision.toFixed(3)}</td><td>${rr.recall.toFixed(3)}</td><td>${rr["f1-score"].toFixed(3)}</td><td>${rr.support}</td></tr>`;
  }).join("");
  return `<div style="overflow-x:auto;"><table><tr><th>Class</th><th>Precision</th><th>Recall</th><th>F1</th><th>Support</th></tr>${rows}</table></div>`;
}
</script>
